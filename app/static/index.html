<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Board</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="board-header">
    <h1>Feedback Board</h1>
    <p class="board-subtitle">Share an idea, then track it through to done.</p>
  </header>

  <main class="board">
    <section id="feedback-summary" class="feedback-section feedback-summary"
             role="status" aria-live="polite"
             aria-labelledby="feedback-summary-heading">
      <h2 id="feedback-summary-heading">Feedback summary</h2>
      <dl class="summary-counts">
        <dt>Total</dt>
        <dd id="summary-total">0</dd>
        <dt>Open</dt>
        <dd id="summary-open">0</dd>
        <dt>Completed</dt>
        <dd id="summary-completed">0</dd>
      </dl>
    </section>

    <form id="feedback-form" class="feedback-form" autocomplete="off">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" maxlength="200" required
             placeholder="Short summary">

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="3"
                placeholder="Optional details"></textarea>

      <button type="submit">Submit feedback</button>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>

    <section class="feedback-section">
      <h2>Submitted feedback</h2>
      <div id="feedback-filter" class="feedback-filter" role="group"
           aria-label="Filter feedback by state">
        <button id="filter-all" type="button" class="filter-button"
                aria-pressed="true">All</button>
        <button id="filter-open" type="button" class="filter-button"
                aria-pressed="false">Open</button>
        <button id="filter-completed" type="button" class="filter-button"
                aria-pressed="false">Completed</button>
      </div>
      <div class="feedback-sort">
        <label id="sort-feedback-label" for="sort-feedback">Sort feedback</label>
        <select id="sort-feedback" class="sort-select" aria-label="Sort feedback">
          <option value="newest-first" selected>Newest first</option>
          <option value="oldest-first">Oldest first</option>
        </select>
      </div>
      <p id="empty-state" class="empty-state">
        No feedback yet. Add the first item using the form above.
      </p>
      <ul id="feedback-list" class="feedback-list"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
